name: Generate DevMarket Scoreboard

on:
  schedule:
    # Runs at 00:00 UTC (21:00 BRT) every Wednesday night / Thursday morning
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual execution from the Actions tab

jobs:
  update-scoreboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scoreboard generator
        env:
          # This must be a Personal Access Token (PAT) stored in your Secrets
          # since it accesses a different repository.
          GITHUB_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }}
        run: |
          python generate_scoreboard.py \
            --repo "ds881-2026-alexkutzke/ds881-devmarket-2026-1-n" \
            --start "2026-05-06T21:00:00-03:00" \
            --output "Placar.html"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Placar.html
          git commit -m "chore: update scoreboard [skip ci]" || echo "No changes to commit"
          git push
