# Sample workflow for building and deploying a mdBook site to GitHub Pag# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: mdBook deploy

on:
  schedule:
    # Runs at 00:00 UTC (21:00 BRT) every Wednesday night / Thursday morning
    - cron: '0 0 * * *'
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.2
    steps:
      - uses: actions/checkout@v4
      
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install --version ${MDBOOK_VERSION} mdbook
          cargo install mdbook-alerts
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - name: Build with mdBook
        run: mdbook build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scoreboard generator for tarde
        working-directory: ./bin
        env:
          GITHUB_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }}
        run: |
          python3 generate_scoreboard.py \
            -r "ds881-2026-alexkutzke/ds881-devmarket-2026-1-t" \
            -s "2026-05-07T14:30:00-03:00" \
            -i ds881-2026-1-t-alunos.csv \
            -o ds881-2026-1-t-placar.html \
            -w 5 \
            --no-participation

          python3 generate_scoreboard.py \
            -r "ds881-2026-alexkutzke/ds881-devmarket-2026-1-n" \
            -s "2026-05-06T21:00:00-03:00" \
            -i ds881-2026-1-n-alunos.csv \
            -o ds881-2026-1-n-placar.html \
            -w 5 
          

      - name: Move HTML files to deploy directory
        run: |
          mv bin/ds881-2026-1-n-placar.html ./book/
          mv bin/ds881-2026-1-t-placar.html ./book/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
